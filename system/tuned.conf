# /etc/tuned/profiles/fedokawai/tuned.conf — installed by setup.sh (tuned-adm profile fedokawai).
# An always-plugged desktop: everything from throughput-performance (the CPU's performance
# governor and energy preference, no deep power saving), with two of its server values put
# back for a desktop that swaps to zram.
[main]
summary=fedokawai: an always-plugged desktop — full CPU performance, zram kept useful
include=throughput-performance

[sysctl]
# zram swap is compression in RAM, not a disk: let the kernel use it (the parent's 10
# would leave it almost unused and drop file cache instead)
vm.swappiness=100
# start writing big copies early instead of letting 40 % of RAM fill first (the parent's
# value), so a torrent or a large copy never stalls the desktop when it flushes
vm.dirty_ratio=20
vm.dirty_background_ratio=10
# swap-in from zram is a memory copy: read one page, not a cluster of 8 (disk-era readahead)
vm.page-cluster=0
# no extra reclaim bursts after fragmentation events (smoother frame pacing under load)
vm.watermark_boost_factor=0
