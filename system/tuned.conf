# /etc/tuned/profiles/fedokawaii/tuned.conf — installed by setup.sh (tuned-adm profile fedokawaii).
# An always-plugged desktop: everything from throughput-performance (the CPU's performance
# governor and energy preference, no deep power saving), with a few of its server values put
# back for a desktop that swaps to zram.
[main]
summary=fedokawaii: an always-plugged desktop — full CPU performance, zram kept useful
include=throughput-performance

[sysctl]
# zram swap is compression in RAM, not a disk: let the kernel use it (the parent's 10
# would leave it almost unused and drop file cache instead)
vm.swappiness=100
# swap-in from zram is a memory copy: read one page, not a cluster of 8 (disk-era readahead)
vm.page-cluster=0
# no extra reclaim bursts after fragmentation events (smoother frame pacing under load)
vm.watermark_boost_factor=0

[vm]
# start writing big copies early instead of letting 40 % of RAM fill first (the parent's
# value), so a torrent or a large copy never stalls the desktop when it flushes. Set in
# the same plugin as the parent's (tuned's [vm]): a child overrides its parent there,
# where a [sysctl] line would race the parent's [vm] setting
dirty_bytes=20%
dirty_background_bytes=10%
