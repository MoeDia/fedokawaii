<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- /etc/fonts/conf.d/60-fedokawaii-pixel.conf — installed by setup.sh, for every account (the
     login screen runs as its own user). The desktop's pixel font, Fusion Pixel 12 (Latin and
     Japanese in one face: terminal, bar, menus, notices, lock, login, boot menu), and its pixel
     icons (Sumi Icons, Sumi Icons Term) are drawn without smoothing, hinting or colour
     fringes: their outlines sit exactly on a 12 px grid, so at 12, 24, 36 or 48 px every pixel
     comes out a sharp square. At any other size (an app's own) the font keeps the usual
     smoothing, which reads better than broken pixels. Read after the users' own fonts.conf
     (50-user.conf), so these rules have the last word.
     Check: fc-match -f '%{antialias}\n' 'Fusion Pixel 12px Mono ja:pixelsize=24' → False -->
<fontconfig>
  <!-- the pixel font: crisp, no smoothing, no hinting, no colour fringes — at whole multiples
       of its 12 px grid only. At any other size (a GTK app's own size) it keeps the general
       smoothing above, which reads better than broken pixels -->
  <match target="font">
    <test name="family" compare="contains"><string>Fusion Pixel</string></test>
    <test name="pixelsize" compare="more_eq"><double>11.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>12.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>Fusion Pixel</string></test>
    <test name="pixelsize" compare="more_eq"><double>23.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>24.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>Fusion Pixel</string></test>
    <test name="pixelsize" compare="more_eq"><double>35.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>36.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>Fusion Pixel</string></test>
    <test name="pixelsize" compare="more_eq"><double>47.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>48.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <!-- the pixel icons: always on their grid -->
  <match target="font">
    <test name="family" compare="contains"><string>Sumi Icons</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
