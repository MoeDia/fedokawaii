<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- /etc/fonts/conf.d/60-fedokawaii-pixel.conf — installed by setup.sh, for every account (the
     login screen runs as its own user). The desktop's dot faces — Sumi UI (東雲 Shinonome Gothic
     14: bar, panels, menus, launcher, notices, lock, login) and Sumi Term (Kappa 20 Bold:
     the terminals), tools/build-fonts.py — and its pixel icons (Sumi Icons, Sumi Icons Term)
     are drawn without smoothing, hinting or colour fringes: their outlines sit exactly on their
     pixel grid, and the desktop draws them only at its whole multiples (Sumi UI 14, 28, 42 · Sumi
     Term 20, 40), so every pixel comes out a sharp square. Read after the users' own fonts.conf
     (50-user.conf), so these rules have the last word.
     Check: fc-match -f '%{antialias}\n' 'Sumi UI:pixelsize=14' → False -->
<fontconfig>
  <match target="font">
    <test name="family" compare="eq"><string>Sumi UI</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq"><string>Sumi Term</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>Sumi Icons</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
