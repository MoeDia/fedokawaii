<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- /etc/fonts/conf.d/60-fedokawaii-pixel.conf — installed by setup.sh, for every account (the
     login screen runs as its own user). The desktop's dot face — Sumi UI (東雲 Shinonome Gothic
     14: bar, panels, menus, launcher, notices, lock, login; tools/build-fonts.py) — and its
     pixel icons (Sumi Icons, Sumi Icons Term) are drawn without smoothing, hinting or colour
     fringes: their outlines sit exactly on their pixel grid, and the desktop draws them only at
     its whole multiples (Sumi UI 14, 28, 42 · the icons at the terminal's 16), so every pixel
     comes out a sharp square. The terminal's face, "Sumi Term", is UDEV Gothic NF (installed by
     lib/upstream.sh as it comes: "UDEV Gothic" is its licence's reserved name) — the alias
     below; drawn smoothed in grey (foot's see-through ground has no room for colour fringes)
     with its own light hinting. Read after the users' own fonts.conf (50-user.conf), so these
     rules have the last word.
     Check: fc-match -f '%{antialias}\n' 'Sumi UI:pixelsize=14' → False;
            fc-match 'Sumi Term' → UDEVGothicNF-Regular.ttf -->
<fontconfig>
  <match target="font">
    <test name="family" compare="eq"><string>Sumi UI</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <alias binding="same">
    <family>Sumi Term</family>
    <prefer><family>UDEV Gothic NF</family></prefer>
  </alias>
  <match target="font">
    <test name="family" compare="eq"><string>UDEV Gothic NF</string></test>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>Sumi Icons</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
