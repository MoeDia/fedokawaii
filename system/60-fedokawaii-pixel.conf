<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- /etc/fonts/conf.d/60-fedokawaii-pixel.conf — installed by setup.sh, for every account (the
     login screen runs as its own user). The desktop's pixel font, Fusion Pixel (Latin and
     Japanese in one face), in its two cuts — the 12 px one (bar, menus, notices, lock, login,
     boot menu) and the 10 px one (the terminal) — and its pixel icons (Sumi Icons, Sumi Icons
     Term) are drawn without smoothing, hinting or colour fringes: their outlines sit exactly on
     the cut's pixel grid, so at 1×, 2×, 3× or 4× of it (12, 24, 36, 48 px; 10, 20, 30, 40 px:
     a 2160p screen at scale 2 doubles the terminal's 20) every pixel comes out a sharp square.
     At any other size (an app's own) the font keeps the usual smoothing, which reads better
     than broken pixels. Read after the users' own fonts.conf (50-user.conf), so these rules
     have the last word.
     Check: fc-match -f '%{antialias}\n' 'Fusion Pixel 10px Mono ja:pixelsize=20' → False -->
<fontconfig>
  <!-- the pixel font: crisp, no smoothing, no hinting, no colour fringes — at whole multiples
       of its cut's grid only (12 px: 12, 24, 36, 48, 60 — the last two the display size of the lock's clock and the splash · 10 px: 10, 20, 30, 40) -->
  <match target="font">
    <test name="family" compare="contains"><string>Fusion Pixel 12px</string></test>
    <test name="pixelsize" compare="more_eq"><double>11.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>12.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>Fusion Pixel 12px</string></test>
    <test name="pixelsize" compare="more_eq"><double>23.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>24.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>Fusion Pixel 12px</string></test>
    <test name="pixelsize" compare="more_eq"><double>35.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>36.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>Fusion Pixel 12px</string></test>
    <test name="pixelsize" compare="more_eq"><double>47.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>48.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>Fusion Pixel 12px</string></test>
    <test name="pixelsize" compare="more_eq"><double>59.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>60.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>Fusion Pixel 10px</string></test>
    <test name="pixelsize" compare="more_eq"><double>9.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>10.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>Fusion Pixel 10px</string></test>
    <test name="pixelsize" compare="more_eq"><double>19.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>20.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>Fusion Pixel 10px</string></test>
    <test name="pixelsize" compare="more_eq"><double>29.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>30.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>Fusion Pixel 10px</string></test>
    <test name="pixelsize" compare="more_eq"><double>39.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>40.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <!-- the pixel icons: always on their grid -->
  <match target="font">
    <test name="family" compare="contains"><string>Sumi Icons</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
