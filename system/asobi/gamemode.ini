; /etc/gamemode.ini — installed by setup.sh (s_asobi): GameMode, held for the play world's whole
; session (kawa-asobi-session). The CPU is already at full performance (tuned, the desktop's
; profile): what GameMode adds is the card at its full clocks and the game ahead of everything else.
[general]
reaper_freq=5
renice=10
ioprio=0
inhibit_screensaver=0
softrealtime=off
disable_splitlock=1
[gpu]
apply_gpu_optimisations=accept-responsibility
gpu_device=0
amd_performance_level=high
