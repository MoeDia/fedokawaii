; /etc/gamemode.ini — installed by setup.sh (s_asobi): GameMode, held for the play world's whole
; session (kawa-asobi-world: gamemoded -r). The CPU is already at full performance (tuned, the desktop's
; profile), a game's share of it is the world's slice (kawa-asobi-root: CPUWeight): what GameMode adds
; is the card at its full clocks.
[general]
reaper_freq=5
renice=0
ioprio=off
inhibit_screensaver=0
softrealtime=off
disable_splitlock=0
[gpu]
apply_gpu_optimisations=accept-responsibility
gpu_device=0
amd_performance_level=high
