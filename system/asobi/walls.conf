# /etc/systemd/system/user@ASOBI_UID.service.d/50-kawa-asobi.conf — installed by setup.sh (s_asobi): the
# walls around everything of the play world's user: no other home, no other user's /tmp, /dev/shm or
# System V memory, no other user's processes, no other disk; nothing set-user-id can be made.
[Service]
ProtectHome=tmpfs
BindPaths=/home/asobi
BindPaths=/home/.asobi/drop
BindPaths=/run/user/ASOBI_UID
PrivateTmp=yes
PrivateIPC=yes
ProtectProc=invisible
TemporaryFileSystem=/dev/shm:mode=1777,nosuid,nodev
InaccessiblePaths=-/mnt -/media -/run/media
RestrictSUIDSGID=yes
