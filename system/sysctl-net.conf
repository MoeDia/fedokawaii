# /etc/sysctl.d/60-fedokawaii-net.conf — the kernel's network settings, IPv4 and IPv6 alike
# (each key: the kernel's Documentation/networking/ip-sysctl.rst). Forwarding stays as Fedora
# ships it, off: verify warns if a program turns it on.

# Redirects: nobody on the network re-routes this machine; it is no router, it sends none
net.ipv4.conf.*.accept_redirects = 0
net.ipv4.conf.*.secure_redirects = 0
net.ipv4.conf.*.send_redirects = 0
net.ipv6.conf.*.accept_redirects = 0

# Source routing: a packet does not choose its own way through this machine
net.ipv4.conf.*.accept_source_route = 0
net.ipv6.conf.*.accept_source_route = -1

# Spoofed addresses: a packet must arrive where its answer would leave (strict, RFC 3704);
# firewalld does the same for IPv6 (IPv6_rpfilter=strict, its default)
# (systemd's 50-default.conf sets default to 2 by name, and leaves out all: both named here)
net.ipv4.conf.*.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.rp_filter = 1

# A flood of half-open connections costs no memory; a stray RST cannot end a closing one;
# no answers to broadcast pings, no log lines from malformed error messages
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
