# /etc/fedokawaii/rgb.conf — the one red, device by device, so that they look the same (each brand
# renders red its own way). Read by kawa-rgb at its start. NAME R G B: what the device gets at full.
# The fans, the hub and the cooler's fan hang on the motherboard's headers.
motherboard 255 0 0
keyboard 255 0 0
card 255 0 0
# the lock screen's level, in % of how it looks
dim 30
