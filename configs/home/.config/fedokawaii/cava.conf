; ~/.config/fedokawaii/cava.conf — the bar's music meter (kawa-nowplaying runs
; cava -p with this file). Kept apart from ~/.config/cava/config, so running cava in a
; terminal still draws its normal full-screen bars. cava 0.10 (Fedora's: PulseAudio and
; ALSA input; PipeWire answers the PulseAudio side).

[general]
; 16 bands: 8 for each channel, mirrored with the lowest notes in the middle
bars = 16
; 60 frames a second: the columns rise and fall in steps too short to see, at about 2–3 % of
; a core for waybar to draw (measured: 1.9 % at 20, 3.5 % at 60, software drawing)
framerate = 60
; after 3 s of silence cava stops working (and printing) until sound returns
sleep_timer = 3

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
; each band is a digit 0–6: its column's height (kawa-nowplaying: eq-0 … eq-6)
ascii_max_range = 6
; ';' between bands, a newline after each frame
bar_delimiter = 59
frame_delimiter = 10
channels = stereo

[smoothing]
; cava's default: each frame keeps 77 % of the last, so at 60 frames a column settles in about
; 70 ms — quick to follow the beat, never flickering (higher is slower and smoother)
noise_reduction = 77
