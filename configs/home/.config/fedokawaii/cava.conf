; ~/.config/fedokawaii/cava.conf — the bar's music meter (kawa-nowplaying runs
; cava -p with this file). Kept apart from ~/.config/cava/config, so running cava in a
; terminal still draws its normal full-screen bars. cava 0.10 (Fedora's: PulseAudio and
; ALSA input; PipeWire answers the PulseAudio side).

[general]
; 16 bands: 8 for each channel, mirrored with the lowest notes in the middle
bars = 16
; 60 frames a second: the columns rise and fall in steps too short to see, at about 2–3 % of
; a core for waybar to draw (measured: 1.9 % at 20, 3.5 % at 60, software drawing)
framerate = 60
; never asleep: cava's sleep looks for sound again only once a second — a song back from a
; pause, or out of a quiet passage, would wait up to a second for its meter. kawa-nowplaying
; keeps cava for a while after a pause instead (cava takes half a second to start: its FFT
; plans are measured), and ends it after a few minutes with nothing playing
sleep_timer = 0

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
; each band a number 0–12: its column's height, a pixel a level (kawa-nowplaying: eq-0 … eq-12)
ascii_max_range = 12
; ';' between bands, a newline after each frame
bar_delimiter = 59
frame_delimiter = 10
channels = stereo

[smoothing]
; each frame keeps 66 % of the last (cava's default is 77): with 13 heights a pixel apart the
; columns move in steps of one pixel, so they can follow the music this closely and still glide
; — measured on the desktop, a column rises to two thirds of its height in about 0.12 s of a
; note (0.16 s at 77), and falls as quickly when it ends; lower would flicker
noise_reduction = 66
