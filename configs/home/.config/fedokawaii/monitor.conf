# ~/.config/fedokawaii/monitor.conf — the monitor's own menu, set over DDC/CI by kawa-display
# --monitor at login and on wake: read first, written only when it differs, so this is what a
# factory reset comes back to. Only for the model named; another monitor is left alone.
#   MODEL (EDID maker + product)  CODE  WRITE  [READS: what it answers once set, when not WRITE]
#
# The LG 24G411A-B, what its menu shows over DDC/CI (capabilities: .claude/notes/lane-hardware.md).
# Response time, Black Stabilizer and Adaptive-Sync are not offered there: they stay in its menu.
GSM5CDD 12 70
GSM5CDD 16 50
GSM5CDD 18 50
GSM5CDD 1A 50
GSM5CDD 6C 50
GSM5CDD 6E 50
GSM5CDD 70 50
