# ~/.config/wiremix/wiremix.toml — the mixer in washi (paper). Generated by tools/build-themes.py; edit the palette there.
# wiremix has no include: ~/.config/wiremix/wiremix.toml is a link to this file (theme.sh).
# It reads its colours when it starts, so a mixer left open keeps the old theme until it is
# opened again. Whatever is not set here is wiremix's own default (its keys, names, filters).
theme = "fedokawaii"
char_set = "fedokawaii"
# the sliders end at 150 %, and the keys stop there too (wiremix alone lets them run past it)
enforce_max_volume = true
keybindings = [
  # Esc closes the mixer, as it closes every popup here (wiremix's own Esc only cancels an
  # open list — Enter chooses there, and Esc now closes the whole mixer instead)
  { key = "Esc", action = "Exit" },
]

[themes.fedokawaii]
default_device = { fg = "#9c3922" }
default_stream = { fg = "#9c3922" }
selector = { fg = "#c0462a" }
tab = { fg = "#5f594d" }
tab_selected = { fg = "#0f0e0c" }
tab_marker = { fg = "#9c3922" }
list_more = { fg = "#9b927e" }
node_title = { fg = "#0f0e0c" }
node_target = { fg = "#5f594d" }
volume = { fg = "#2b2721" }
volume_empty = { fg = "#c2b79b" }
volume_filled = { fg = "#2f6e67" }
meter_inactive = { fg = "#c2b79b" }
meter_active = { fg = "#5c682d" }
meter_overload = { fg = "#a8342a" }
meter_center_inactive = { fg = "#c2b79b" }
meter_center_active = { fg = "#5c682d" }
config_device = { fg = "#0f0e0c" }
config_profile = { fg = "#5f594d" }
dropdown_icon = { fg = "#5f594d" }
dropdown_border = { fg = "#5f594d" }
dropdown_item = { fg = "#2b2721" }
dropdown_selected = { fg = "#0f0e0c", bg = "#c2b79b" }
dropdown_more = { fg = "#9b927e" }
help_border = { fg = "#5f594d" }
help_item = { fg = "#2b2721" }
help_more = { fg = "#9b927e" }

# marks one cell wide in the terminal's font: wiremix leaves one cell for each, and its own
# (◇, •••) are geometric shapes Fusion Pixel draws two cells wide — the default device's
# diamond ran into the space after it and touched the name ("◇HD-Audio Generic"). A half
# block (foot draws those itself, exactly one cell) leaves the space whole: the mark, then
# a cell of paper, then the name
[char_sets.fedokawaii]
default_device = "▌"
default_stream = "▌"
list_more = "···"
dropdown_more = "···"
help_more = "···"
