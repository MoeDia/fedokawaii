# ~/.config/fedokawaii/current/mpv.conf — mpv's colours in washi (paper). Generated by tools/build-themes.py; edit the palette there.
# Read by ~/.config/mpv/mpv.conf (include) and handed to open players by kawa-theme.
# On-screen text and menus: ink with a ground outline, vermilion for the chosen row ·
# controller: the ground behind, title and time in ink (they sit over the picture too, so
# they take the strongest contrast), buttons in the text colour, teal while held.
# Every value holding a "#" is quoted whole (an unquoted # starts a comment in mpv).
osd-color="#121b1b"
osd-outline-color="#e8e3c2"
osd-back-color="#ecdfb3"
osd-selected-color="#a84222"
osd-selected-outline-color="#e8e3c2"
script-opt="osc-background_color=#e8e3c2"
script-opt="osc-title_color=#121b1b"
script-opt="osc-timecode_color=#121b1b"
script-opt="osc-time_pos_color=#121b1b"
script-opt="osc-time_pos_outline_color=#e8e3c2"
script-opt="osc-buttons_color=#122625"
script-opt="osc-small_buttonsL_color=#122625"
script-opt="osc-small_buttonsR_color=#122625"
script-opt="osc-top_buttons_color=#122625"
script-opt="osc-held_element_color=#00726a"
script-opt="console-focused_color=#f8f3d8"
script-opt="console-focused_back_color=#82241f"
script-opt="console-match_color=#00726a"
script-opt="context_menu-focused_color=#f8f3d8"
script-opt="context_menu-focused_back_color=#82241f"
