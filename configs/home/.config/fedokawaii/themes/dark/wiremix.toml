# ~/.config/wiremix/wiremix.toml — the mixer in sumi (ink). Generated by tools/build-themes.py; edit the palette there.
# wiremix has no include: ~/.config/wiremix/wiremix.toml is a link to this file (theme.sh).
# It reads its colours when it starts, so a mixer left open keeps the old theme until it is
# opened again. Whatever is not set here is wiremix's own default (its keys, names, filters).
theme = "fedokawaii"
char_set = "fedokawaii"
# the sliders end at 150 %, and the keys stop there too (wiremix alone lets them run past it)
enforce_max_volume = true
keybindings = [
  # Esc closes the mixer, as it closes every popup here (wiremix's own Esc only cancels an
  # open list — Enter chooses there, and Esc now closes the whole mixer instead)
  { key = "Esc", action = "Exit" },
]

[themes.fedokawaii]
default_device = { fg = "#eb5324" }
default_stream = { fg = "#eb5324" }
selector = { fg = "#eb5324" }
tab = { fg = "#9a8767" }
tab_selected = { fg = "#f1e1b4" }
tab_marker = { fg = "#eb5324" }
list_more = { fg = "#65583f" }
node_title = { fg = "#f1e1b4" }
node_target = { fg = "#9a8767" }
volume = { fg = "#d4bf9a" }
volume_empty = { fg = "#3c2f22" }
volume_filled = { fg = "#82c1b4" }
meter_inactive = { fg = "#3c2f22" }
meter_active = { fg = "#8fa071" }
meter_overload = { fg = "#eb5324" }
meter_center_inactive = { fg = "#3c2f22" }
meter_center_active = { fg = "#8fa071" }
config_device = { fg = "#f1e1b4" }
config_profile = { fg = "#9a8767" }
dropdown_icon = { fg = "#9a8767" }
dropdown_border = { fg = "#9a8767" }
dropdown_item = { fg = "#d4bf9a" }
dropdown_selected = { fg = "#f1e1b4", bg = "#2d251e" }
dropdown_more = { fg = "#65583f" }
help_border = { fg = "#9a8767" }
help_item = { fg = "#d4bf9a" }
help_more = { fg = "#65583f" }

# the marks: wiremix leaves one cell for each and puts the name right after it — its own
# diamond (◇) filled the cell and touched the name ("◇HD-Audio Generic"). A half block
# (foot draws those itself, exactly one cell, its right half paper) leaves air before the
# name: the mark, then paper, then the name
[char_sets.fedokawaii]
default_device = "▌"
default_stream = "▌"
list_more = "···"
dropdown_more = "···"
help_more = "···"
