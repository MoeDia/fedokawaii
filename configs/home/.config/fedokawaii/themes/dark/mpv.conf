# ~/.config/fedokawaii/current/mpv.conf — mpv's colours in sumi (ink). Generated by tools/build-themes.py; edit the palette there.
# Read by ~/.config/mpv/mpv.conf (include) and handed to open players by kawa-theme.
# On-screen text and menus: ink with a ground outline, vermilion for the chosen row ·
# controller: the ground behind, title and time in ink (they sit over the picture too, so
# they take the strongest contrast), buttons in the text colour, teal while held.
# Every value holding a "#" is quoted whole (an unquoted # starts a comment in mpv).
osd-color="#ece3cc"
osd-outline-color="#0f0e0c"
osd-back-color="#161411"
osd-selected-color="#d0583a"
osd-selected-outline-color="#0f0e0c"
script-opt="osc-background_color=#0f0e0c"
script-opt="osc-title_color=#ece3cc"
script-opt="osc-timecode_color=#ece3cc"
script-opt="osc-time_pos_color=#ece3cc"
script-opt="osc-time_pos_outline_color=#0f0e0c"
script-opt="osc-buttons_color=#cfc3a6"
script-opt="osc-small_buttonsL_color=#cfc3a6"
script-opt="osc-small_buttonsR_color=#cfc3a6"
script-opt="osc-top_buttons_color=#cfc3a6"
script-opt="osc-held_element_color=#7fb8b0"
script-opt="console-focused_color=#0f0e0c"
script-opt="console-focused_back_color=#d0583a"
script-opt="console-match_color=#7fb8b0"
script-opt="context_menu-focused_color=#0f0e0c"
script-opt="context_menu-focused_back_color=#d0583a"
