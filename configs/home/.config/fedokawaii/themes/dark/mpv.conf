# ~/.config/fedokawaii/current/mpv.conf — mpv's colours in sumi (ink). Generated by tools/build-themes.py; edit the palette there.
# Read by ~/.config/mpv/mpv.conf (include) and handed to open players by kawa-theme.
# On-screen text and menus: ink with a ground outline, vermilion for the chosen row ·
# controller: the ground behind, title and time in ink (they sit over the picture too, so
# they take the strongest contrast), buttons in the text colour, teal while held.
# Every value holding a "#" is quoted whole (an unquoted # starts a comment in mpv).
osd-color="#f1e1b4"
osd-outline-color="#181715"
osd-back-color="#1c1916"
osd-selected-color="#eb5324"
osd-selected-outline-color="#181715"
script-opt="osc-background_color=#181715"
script-opt="osc-title_color=#f1e1b4"
script-opt="osc-timecode_color=#f1e1b4"
script-opt="osc-time_pos_color=#f1e1b4"
script-opt="osc-time_pos_outline_color=#181715"
script-opt="osc-buttons_color=#d4bf9a"
script-opt="osc-small_buttonsL_color=#d4bf9a"
script-opt="osc-small_buttonsR_color=#d4bf9a"
script-opt="osc-top_buttons_color=#d4bf9a"
script-opt="osc-held_element_color=#82c1b4"
script-opt="console-focused_color=#111314"
script-opt="console-focused_back_color=#eb5324"
script-opt="console-match_color=#82c1b4"
script-opt="context_menu-focused_color=#111314"
script-opt="context_menu-focused_back_color=#eb5324"
