# ~/.config/MangoHud/MangoHud.conf — the in-game overlay (MangoHud 0.8), in the desktop's ink.
# In every game Steam starts (kawa-steam starts Steam with MANGOHUD=1), hidden until you ask
# for it: Shift_R+F12 shows or hides it. Elsewhere: mangohud GAME.
no_display
# Always the dark palette: it sits over a game, where ink on a dim panel reads best.

# what it shows — one compact column: frame rate and frame times first, then the load
fps
frametime
frame_timing
gpu_stats
gpu_temp
cpu_stats
cpu_temp
vram
ram
throttling_status
fps_color_change
fps_value=30,60
gpu_load_change
gpu_load_value=60,90
cpu_load_change
cpu_load_value=60,90

# the look: Fusion Pixel 12 at 24 px (twice its pixel grid, so every pixel stays square),
# square corners, a dim ink panel, the theme's colours
font_file=/usr/local/share/fonts/fusion-pixel/fusion-pixel-12px-monospaced-ja.ttf
font_size=24
round_corners=0
position=top-left
background_color=0f0e0c
background_alpha=0.8
text_outline
text_outline_color=0f0e0c
text_color=cfc3a6
gpu_color=d0583a
cpu_color=7fb8b0
vram_color=d29f45
ram_color=d29f45
engine_color=877f6f
io_color=877f6f
frametime_color=7fb8b0
wine_color=9079a9
media_player_color=cfc3a6
battery_color=d29f45
network_color=877f6f
# red · ochre · green for low · middle · high frame rates, and the reverse for load
fps_color=d64b4b,d29f45,8e9a5b
gpu_load_color=8e9a5b,d29f45,d64b4b
cpu_load_color=8e9a5b,d29f45,d64b4b

toggle_hud=Shift_R+F12
