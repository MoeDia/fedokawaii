# ~/.config/MangoHud/MangoHud.conf — the in-game overlay (MangoHud 0.8), in the desktop's ink.
# In every game Steam starts (kawa-steam starts Steam with MANGOHUD=1), hidden until you ask
# for it: Shift_R+F12 shows or hides it. Elsewhere: mangohud GAME.
no_display
# Always the dark palette: it sits over a game, where ink on a dim panel reads best.

# what it shows — one compact column: frame rate and frame times first, then the load
fps
frametime
frame_timing
gpu_stats
gpu_temp
cpu_stats
cpu_temp
vram
ram
throttling_status
fps_color_change
fps_value=30,60
gpu_load_change
gpu_load_value=60,90
cpu_load_change
cpu_load_value=60,90

# the look: Sumi UI at 28 px (twice its pixel grid, so every pixel stays square),
# square corners, a dim ink panel, the theme's colours
font_file=/usr/local/share/fonts/fedokawaii/SumiUI.ttf
font_size=28
round_corners=0
position=top-left
background_color=181715
background_alpha=0.8
text_outline
text_outline_color=181715
text_color=d4bf9a
gpu_color=eb5324
cpu_color=82c1b4
vram_color=e2b540
ram_color=e2b540
engine_color=9a8767
io_color=9a8767
frametime_color=82c1b4
wine_color=9a72aa
media_player_color=d4bf9a
battery_color=e2b540
network_color=9a8767
# red · ochre · green for low · middle · high frame rates, and the reverse for load
fps_color=eb5324,e2b540,8fa071
gpu_load_color=8fa071,e2b540,eb5324
cpu_load_color=8fa071,e2b540,eb5324

toggle_hud=Shift_R+F12
