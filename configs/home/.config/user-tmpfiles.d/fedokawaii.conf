# ~/.config/user-tmpfiles.d/fedokawaii.conf — what ages out of ~/.cache by itself
# (systemd-tmpfiles --user --clean, run by kawa-tidy; %C is ~/.cache). Only caches: each is
# made again when needed. An age counts from a file's last change or use, whichever is later.
# thumbnails of files you have not looked at for a month
e %C/thumbnails - - - 30d
# yt-dlp's copies of the sites' player scripts
e %C/yt-dlp - - - 30d
# pip's and npm's downloads (uv prunes its own: kawa-tidy)
e %C/pip - - - 30d
e %C/npm - - - 30d
