#? btop — partial config: unspecified options keep btop's defaults.
#* The current theme's colours (dark ink or light paper; kawa-theme switches them and
#* tells btop to reload): square corners and chunky block graphs, like an old monitor.
#* btop takes a theme only by name, from ~/.config/btop/themes: fedokawaii.theme there is a
#* link to the current theme's (theme.sh makes it).
color_theme = "fedokawaii"
theme_background = False
truecolor = True
rounded_corners = False
graph_symbol = "block"
#* The graphics card in the CPU box, one line: load, memory, heat, watts (5 opens its own
#* box, which the bar's small window has no room for). On AMD btop reads it through
#* rocm-smi's library (lib/manifest.sh, PKG_GPU_amd); where it finds no card the line is
#* left out — Intel's graphics would need btop to hold cap_perfmon, which setup does not give.
show_gpu_info = "On"
#* No clock in its frame: the bar's, right above, says the time.
clock_format = ""
#* Keep this file authoritative (btop would otherwise rewrite it on exit).
save_config_on_exit = False
