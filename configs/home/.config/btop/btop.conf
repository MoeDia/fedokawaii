#? btop — partial config: unspecified options keep btop's defaults.
#* The current theme's colours (dark ink or light paper; kawa-theme switches them and
#* tells btop to reload): square corners and chunky block graphs, like an old monitor.
#* btop takes a theme only by name, from ~/.config/btop/themes: fedokawai.theme there is a
#* link to the current theme's (theme.sh makes it).
color_theme = "fedokawai"
theme_background = False
truecolor = True
rounded_corners = False
graph_symbol = "block"
#* Keep this file authoritative (btop would otherwise rewrite it on exit).
save_config_on_exit = False
