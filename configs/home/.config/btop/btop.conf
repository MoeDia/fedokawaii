#? btop — partial config: unspecified options keep btop's defaults.
#* The current theme's colours (dark ink or light paper; kawa-theme switches them and
#* tells btop to reload): square corners and chunky block graphs, like an old monitor —
#* the block graphs are drawn by foot itself, whole pixels at any size.
#* btop takes a theme only by name, from ~/.config/btop/themes: fedokawaii.theme there is a
#* link to the current theme's (theme.sh makes it).
color_theme = "fedokawaii"
theme_background = False
truecolor = True
rounded_corners = False
graph_symbol = "block"
#* The boxes, top to bottom: the processor, the graphics card, then memory and network
#* beside the processes. The graphics card has a box of its own — its name, its load as a
#* graph, and in words its load, memory used of all it has, heat and watts. Its number is
#* the card's place among the AMD graphics btop sees: ROCm SMI hands them over sorted by
#* PCI address, so theme.sh writes it from the machine (lib/hardware.sh, hw_btop_gpu), and
#* leaves the box out where there is no discrete AMD card. The processor's own graphics is
#* left out: the desktop draws on the card.
#* On AMD btop reads the cards through rocm-smi's library (lib/manifest.sh, PKG_GPU_amd);
#* where it finds none, the box is left out.
shown_boxes = "@BTOP_BOXES@"
#* … and no graphics-card lines in the processor's box: the card's box says it all once
show_gpu_info = "Off"
#* one graph each: the processor's total load, the card's load (not mirrored halves)
cpu_single_graph = True
gpu_mirror_graph = False
#* Layouts for smaller windows, in the order a smaller window needs them (p cycles them;
#* btop's own 0 is the four boxes without the card's, and holds four boxes at most):
#* 1 processor, card and processes · 2 processor and processes · 3 card and processes ·
#* 4 processor and card · 5 processes · 6 memory and network · 7 memory. (Never the card's
#* box alone: btop 1.4.5 stops on that layout.) Typed in a terminal, btop starts in the
#* first its window holds (the shell's btop, ~/.bashrc.d/fedokawaii.sh, whose table says what
#* each needs).
presets = "cpu:0:default,@BTOP_GPU@:0:default,proc:0:default cpu:0:default,proc:0:default @BTOP_GPU@:0:default,proc:0:default cpu:0:default,@BTOP_GPU@:0:default proc:0:default mem:0:default,net:0:default mem:0:default"
#* Memory as bars with their numbers across the whole box (no small graphs beside them, no
#* disks column: on Fedora's Btrfs "/" and "/home" are one pool, the same two numbers twice,
#* and how full a disk is moves over months, not seconds — the file manager and the drives'
#* menu say it)
mem_graphs = False
show_disks = False
#* The processes: memory in bytes, no per-process graphs or fading rows (a plain list in
#* the theme's colours), the kernel's own threads left out
proc_mem_bytes = True
proc_cpu_graphs = False
proc_gradient = False
proc_filter_kernel = True
#* A desktop: no battery meter
show_battery = False
#* A sample a second (btop's default is two): a graph draws a sample a column, so a fresh
#* btop fills its widest graph, the processor's (about 150 columns full-screen), in two and
#* a half minutes instead of five — what stood empty at the left of each box. (The cost: a
#* look at /proc each second while btop is open; nothing while it is closed.)
update_ms = 1000
#* No clock in its frame: the bar's, right above, says the time.
clock_format = ""
#* Keep this file authoritative (btop would otherwise rewrite it on exit).
save_config_on_exit = False
