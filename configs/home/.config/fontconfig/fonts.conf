<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ~/.config/fontconfig/fonts.conf — sans: Noto Sans · serif: Liberation Serif · mono: JetBrainsMono Nerd
     Arabic: Noto Naskh (sans) / Amiri (serif) · Japanese, Chinese, Korean: Noto Sans CJK in apps,
     web pages and subtitles; PixelMplus 12 in the terminal and where the desktop names it (bar,
     menus, notices) · emoji: Noto Color Emoji
     Pixel fonts (Departure Mono, Sumi Icons and Sumi Icons Term, PixelMplus) are drawn without smoothing: their
     outlines sit exactly on the pixel grid at 11 / 11 / 12 px, so every pixel comes out sharp.
     Check: fc-match monospace · fc-match -v 'PixelMplus12:pixelsize=11' antialias -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Noto Sans</family><family>Noto Naskh Arabic</family><family>Noto Sans CJK JP</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Liberation Serif</family><family>Amiri</family><family>Noto Sans CJK JP</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrainsMono Nerd Font</family><family>Liberation Mono</family><family>PixelMplus12</family><family>Noto Sans CJK JP</family></prefer></alias>

  <!-- Arabic text gets a real Naskh face before any Latin fallback -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Naskh Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Amiri</string></edit>
  </match>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

  <!-- pixel fonts: crisp, no smoothing, no hinting, no colour fringes -->
  <match target="font">
    <test name="family" compare="contains"><string>DepartureMono</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <!-- PixelMplus 12 is drawn on a 12 px grid: crisp only at 12 and 24 px. At any other
       size (Japanese inside the 11 px bar, or a GTK app's own size) it keeps the general
       smoothing above, which reads better than broken pixels -->
  <match target="font">
    <test name="family" compare="contains"><string>PixelMplus</string></test>
    <test name="pixelsize" compare="more_eq"><double>11.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>12.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>PixelMplus</string></test>
    <test name="pixelsize" compare="more_eq"><double>23.5</double></test>
    <test name="pixelsize" compare="less_eq"><double>24.5</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>Sumi Icons</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
  <!-- (after the general rule above: in fontconfig the last matching edit wins) -->
</fontconfig>
