# ~/.config/systemd/user/xdg-desktop-portal-wlr.service.d/sharing.conf — a drop-in for the
# screen-sharing portal. A portal that crashed or was stopped mid-share never runs exec_after
# (~/.config/xdg-desktop-portal-wlr/config): the notices it held back come back, and the bar's
# 共有 seal goes, anyway. (Restart=on-failure is the unit's own; "-": mako may be gone already.)
[Service]
# only while mako runs: makoctl would start one by D-Bus activation — at logout, when the
# portal stops after the screen is gone, that would be a mako with nowhere to show
ExecStopPost=-/bin/sh -c 'pgrep -xu %U mako >/dev/null || exit 0; exec makoctl mode -r sharing'
ExecStopPost=-%h/.local/bin/kawa-dwlstatus --poke 12
