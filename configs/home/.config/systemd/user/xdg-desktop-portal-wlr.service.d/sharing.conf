# ~/.config/systemd/user/xdg-desktop-portal-wlr.service.d/sharing.conf — a drop-in for the
# screen-sharing portal. A portal that crashed or was stopped mid-share never runs exec_after
# (~/.config/xdg-desktop-portal-wlr/config): the notices it held back come back, and the bar's
# 共有 seal goes, anyway. (Restart=on-failure is the unit's own; "-": mako may be gone already.)
[Service]
# One question per share. Brave (Chromium, Electron) opens one portal session for its picker's
# preview and another for the share itself, and joins them with a restore token, asked for as
# "transient" (good while the app runs). The portal hands one out only when this allows it
# (0.7 and later; unset, it never does, and the share asks again): a screen is then shared
# again without a question. A window gets no token from the portal (it remembers screens by
# name only): kawa-share remembers that choice itself. "transient" also caps an app asking
# for "permanent" (OBS): nothing is ever shared again after a restart without asking.
Environment=XDPW_PERSIST_MODE=transient
# only while mako runs: makoctl would start one by D-Bus activation — at logout, when the
# portal stops after the screen is gone, that would be a mako with nowhere to show
ExecStopPost=-/bin/sh -c 'pgrep -xu %U mako >/dev/null || exit 0; exec makoctl mode -r sharing'
ExecStopPost=-%h/.local/bin/kawa-dwlstatus --poke 12
