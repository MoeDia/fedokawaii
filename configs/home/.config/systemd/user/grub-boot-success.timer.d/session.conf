# ~/.config/systemd/user/grub-boot-success.timer.d/session.conf — Fedora's timer that marks a
# boot successful (GRUB's hidden menu stays hidden after one) runs here only inside the desktop:
# autostart.sh starts it, two minutes later it marks the boot, and it stops with the session —
# a desktop that ends sooner leaves the boot unmarked, so the menu shows next time. (Fedora
# starts it in every session; setup turns that off, s_boot in setup.sh says why.)
[Unit]
PartOf=dwl-session.target
