# ~/.config/spotify-player/theme.toml — no palette table: spotify_player then uses the
# terminal's 16 colours (foot's palette, dark or light). Only accents are chosen here.
[[themes]]
name = "sumi"
[themes.component_style]
block_title = { fg = "BrightWhite", modifiers = ["Bold"] }
border = { fg = "Black" }
playback_track = { fg = "BrightRed", modifiers = ["Bold"] }
playback_artists = { fg = "White" }
playback_album = { fg = "BrightBlack" }
playback_status = { fg = "BrightRed", modifiers = ["Bold"] }
playback_progress_bar = { fg = "BrightRed", bg = "Black" }
current_playing = { fg = "BrightRed", modifiers = ["Bold"] }
selection = { fg = "Black", bg = "White", modifiers = ["Bold"] }
table_header = { fg = "BrightBlack" }
like = { fg = "BrightRed" }
page_desc = { fg = "Cyan", modifiers = ["Bold"] }
