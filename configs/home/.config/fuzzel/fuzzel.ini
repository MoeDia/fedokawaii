# ~/.config/fuzzel/fuzzel.ini — fuzzel 1.14+. Validate: fuzzel --check-config
# The launcher (Super+Space): Papirus icon + application name, nothing else.
# The same look serves every menu: quick settings, audio, calendar, brightness,
# power, help, and what to share when an app shares your screen (the wallpaper and
# clipboard windows are fzf, in the terminal).
# Those scripts only add placement and size on the command line.
# Every panel is a solid card with a full 2 px warm-grey border — the same border as the
# windows and the notices; nothing of the wallpaper shows through.
# Departure Mono and the Sumi Icons sit on an 11 px grid, so they are set by pixel size,
# never by points; Japanese (song titles, file names) falls back to PixelMplus 12 at its
# own 12 px grid, Arabic to Noto Kufi (a square, even-stroked Arabic that sits well beside
# pixel letters) at 13 px, joined and right-to-left. Colours and the icon theme come from the current theme (dark or light).

[main]
include=~/.config/fedokawai/current/fuzzel.ini
font=DepartureMono Nerd Font:pixelsize=11,Sumi Icons:pixelsize=11,PixelMplus12:pixelsize=12,Noto Kufi Arabic:pixelsize=13
prompt="> "
placeholder=type to search
fields=name
terminal=footclient
width=34
lines=10
horizontal-pad=16
vertical-pad=12
# 28 px rows, set in pixels: a bare number is points, which fuzzel turns into pixels by
# the monitor's own dpi (25–29 px on common screens), and a row's ink then sits a pixel
# off centre. inner-pad 9 makes a menu with a prompt (the launcher) an odd number of pixels
# tall, so centred it sits in the middle of the screen below the bar to the pixel; a menu
# without one (power, share) is always even (2 × 2 border + 2 × 12 pad + 28 per row), so it
# sits half a pixel off down — across, every menu is exact.
inner-pad=9
line-height=28px

[border]
width=2
radius=0
