# ~/.config/fuzzel/fuzzel.ini — fuzzel 1.14+. Validate: fuzzel --check-config
# The launcher (Super+Space): each entry's icon and its name, nothing else — a window
# program's own icon (as its package ships it, in the hicolor folders, fuzzel's default: no
# icon pack), every other entry its app seal (current/apps, tools/build-appicons.py).
# The same look serves every small menu (kawa-menu: the calendar, power, help, the drives,
# the weather, what to share when an app shares your screen…); those scripts only add
# placement and size on the command line.
#
# Drawn as a panel of the design system (docs/design-system.md), as close as fuzzel allows:
#   frame   2 px, muted ([border] width; the colour is the theme's), square corners
#   pad     12 px of surface inside the frame all round: vertical-pad 12; across, fuzzel
#           starts the chosen row's fill a third of horizontal-pad before the words, so 18
#           puts the fill at 2 + 12 = 14 (the content's edge, as a panel's row) and the icon
#           6 px into the row (at 20, where a panel row's glyph stands)
#   width   44 columns of 6 px: 2 + 18 + 264 + 18 + 2 = 304 px, quick settings' own width;
#           the chosen row's fill is the content's 276 px exactly
#   rows    20 px (line-height, in pixels: a bare number is points, which fuzzel turns into
#           pixels by the monitor's dpi); fuzzel sizes an icon to the row less the font's
#           descent: 18 px, one pixel of air above and below
#   heading a panel heading (§4): the seal — 起 in accent_text in its 1 px edge2 frame, 23 × 23,
#           at the content's corner (14, 14) — 6 px, the name "launcher" in text, 6 px, the
#           stitch in edge2 on to x 284 (fuzzel's text margin: 6 px short of the content's
#           edge). fuzzel draws the prompt as one run in one colour, so the heading is two
#           glyphs of the theme's own colour font, which keep their inks in any run: U+FE800
#           the seal (the prompt); U+FE801 the name, U+FE802 U+FE802 U+FE803 the stitch (the
#           placeholder: FreeType draws so long a thin colour glyph only in pieces) — Sumi
#           Seal Ink or Paper, tools/build-seal.py; the font line is the theme's for that
#           (~/.config/fedokawaii/current/fuzzel.ini). What you type takes the name's place,
#           at x 43. inner-pad 9 puts the first row at 43, 6 px under the seal, and the last
#           row ends 12 px above the frame
#   type    Sumi UI, Fusion Pixel 12 heavier (Latin and Japanese in one face) and the Sumi Icons on their
#           12 px grid, set by pixel size, never by points; JetBrainsMono Nerd draws the few
#           symbols neither has, Arabic falls to Noto Kufi (square, even-stroked: it sits well
#           beside pixel letters) at 13 px, joined and right-to-left
# What fuzzel cannot draw: the stitch while you type (the placeholder goes, and the typed
# words, Fusion's own, stand a pixel higher than the name: the heading's glyphs are drawn one
# lower than the line's baseline, for the 12 px pad); a hovered row only recoloured (the pointer
# moves the chosen row, filled); a list with nothing chosen until a key is pressed (its first
# row is always chosen); its text cursor in vermilion (it takes the typed words' colour).

[main]
include=~/.config/fedokawaii/current/fuzzel.ini
# (font: the theme's file above — Sumi UI (Fusion Pixel 12, heavier), the theme's Sumi Seal, Sumi Icons, the rest)
prompt="󾠀"
placeholder="󾠁󾠂󾠂󾠃"
# matched against: the name, what the program is (GenericName: "browser" finds Brave) and its
# keywords ("wifi" finds Network, "task manager" System monitor); only the name is shown
fields=name,generic,keywords
terminal=footclient
width=44
lines=10
horizontal-pad=18
vertical-pad=12
inner-pad=9
line-height=20px
# no big copy of the chosen entry's icon in the empty space under a short list (fuzzel draws
# one at half the window's size unless this is 1): the list alone, at every length
image-size-ratio=1

[border]
width=2
radius=0
selection-radius=0
