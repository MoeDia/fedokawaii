# ~/.config/xdg-desktop-portal/wlroots-portals.conf — picked because XDG_CURRENT_DESKTOP=wlroots.
# Every interface named with the one backend that serves it, none left to a default:
# screen sharing & screenshots → wlr; file dialogs → termfilechooser (yazi, through kawa-pick —
# see ../xdg-desktop-portal-termfilechooser/config); the rest the GTK portal serves → gtk.
# Settings among them: the GTK portal serves the color-scheme that kawa-theme sets, which
# GTK 4 and Brave follow live (upstream's example file sends it to darkman).
# One dialog for every app: termfilechooser alone. Should it be missing, verify says so and
# repair builds it again (no second, different dialog quietly taking its place).
[preferred]
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.FileChooser=termfilechooser
org.freedesktop.impl.portal.Settings=gtk
org.freedesktop.impl.portal.AppChooser=gtk
org.freedesktop.impl.portal.Print=gtk
org.freedesktop.impl.portal.Notification=gtk
org.freedesktop.impl.portal.Inhibit=gtk
org.freedesktop.impl.portal.Access=gtk
org.freedesktop.impl.portal.Account=gtk
org.freedesktop.impl.portal.Email=gtk
org.freedesktop.impl.portal.DynamicLauncher=gtk
org.freedesktop.impl.portal.Lockdown=gtk
