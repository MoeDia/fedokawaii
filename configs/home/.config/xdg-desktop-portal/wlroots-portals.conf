# ~/.config/xdg-desktop-portal/wlroots-portals.conf — picked because XDG_CURRENT_DESKTOP=wlroots.
# Screen sharing & screenshots → wlr backend; file dialogs → termfilechooser (yazi, through
# kawa-pick — see ../xdg-desktop-portal-termfilechooser/config); the rest → GTK. Settings is
# named outright (upstream's example file sends it to darkman): the GTK portal serves the
# color-scheme that kawa-theme sets, which GTK 4 and Brave follow live.
# A list is tried in order and a backend that is not installed is skipped: should setup
# not have built termfilechooser, file dialogs are GTK's.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Settings=gtk
org.freedesktop.impl.portal.FileChooser=termfilechooser;gtk
