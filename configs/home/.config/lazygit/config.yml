# ~/.config/lazygit/config.yml — colours by ANSI name → foot's palette, so lazygit follows
# dark and light with the terminal (lazygit knows only the eight base names, and hex).
# The panel you are in has a vermilion frame, like the focused window; the others a quiet
# warm grey (one hex that reads on ink and on paper, for their titles too).
gui:
  nerdFontsVersion: ""          # (no file icons: the Nerd Font's would stand among the pixel ones)
  border: single
  showRandomTip: false          # (a quiet start: no tip of the day under the panels)
  showBottomLine: false         # (no "Donate · Ask Question · version" line: ? lists the keys)
  showCommandLog: false         # (no log of git's commands under the panels: @ shows it)
  # A tall, narrow window (84 columns or fewer: a tile half the screen wide or less) shows
  # the panels above the diff rather than beside it, both the window's full width — chosen
  # again whenever the window changes size. lazygit's own threshold for that is 46 rows,
  # more than a tile of a 1080-pixel screen ever has (40): here from 30. In a small tile,
  # + gives the panel you are in half the window, then all of it (_ goes back).
  portraitMode: auto
  portraitModeAutoMaxWidth: 84
  portraitModeAutoMinHeight: 30
  theme:
    activeBorderColor: [red, bold]
    inactiveBorderColor: ["#877f6f"]
    searchingActiveBorderColor: [yellow, bold]
    optionsTextColor: [blue]
    selectedLineBgColor: [black]
    unstagedChangesColor: [red]
    defaultFgColor: [default]
git:
  overrideGpg: true
  # a commit's message wrapped at 72 columns as you type (git's own convention: its log and
  # e-mails read it so); the subject line above it, 50 or fewer, says what the change does
  commit:
    autoWrapCommitMessage: true
    autoWrapWidth: 72
  # diffs drawn by delta (git-delta), in the terminal's sixteen colours only, so they follow
  # dark and light (and look the same inside neovim): a removed line red, an added one green,
  # the words that changed on the ground's own shade (colour 0), the rest in the code's colours;
  # line numbers in the quiet bright-black, side by side once the diff view is wider than 160
  # columns. | cycles to git's own plain diff. A line number is a link: a click opens the file
  # there, in your editor
  diffRenderers:
    - name: delta
      command: >-
        delta --{{colorScheme}} --paging=never --syntax-theme=ansi --line-numbers
        --line-numbers-left-style=8 --line-numbers-right-style=8 --line-numbers-zero-style=8
        --line-numbers-minus-style=red --line-numbers-plus-style=green
        --minus-style=red --minus-emph-style="bold red 0" --plus-style=green --plus-emph-style="bold green 0"
        --file-style=omit --hunk-header-decoration-style=none
        {{if gt .width 160}}--side-by-side{{end}}
        --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    - type: rawGit
      name: git
# Ctrl+K in the files panel: a commit in the Conventional Commits form (conventionalcommits.org)
# — its type from a menu, an optional scope, the subject — "feat(parser): read nested lists".
# c stays the plain commit
customCommands:
  - key: <ctrl+k>
    context: files
    description: "commit: type(scope): subject (conventional)"
    prompts:
      - type: menu
        key: Type
        title: "type of change"
        options:
          - { name: "feat", description: "a new feature", value: "feat" }
          - { name: "fix", description: "a bug fixed", value: "fix" }
          - { name: "docs", description: "documentation only", value: "docs" }
          - { name: "refactor", description: "code changed, behaviour the same", value: "refactor" }
          - { name: "test", description: "tests added or corrected", value: "test" }
          - { name: "perf", description: "faster or lighter", value: "perf" }
          - { name: "style", description: "formatting, no code change", value: "style" }
          - { name: "build", description: "build, dependencies (Cargo.toml, pyproject.toml)", value: "build" }
          - { name: "chore", description: "anything else", value: "chore" }
      - type: input
        key: Scope
        title: "scope (optional: enter skips)"
      - type: input
        key: Subject
        title: "subject: what it does, lower case, no full stop"
    command: "git commit --message {{if .Form.Scope}}{{printf \"%s(%s): %s\" .Form.Type .Form.Scope .Form.Subject | quote}}{{else}}{{printf \"%s: %s\" .Form.Type .Form.Subject | quote}}{{end}}"
    loadingText: "committing"
os:
  editPreset: nvim
# (a quiet first start too: no "Thanks for using lazygit!" welcome, nor a what's-new after an
# update, to close before the repository shows)
disableStartupPopups: true
