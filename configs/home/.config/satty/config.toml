# ~/.config/satty/config.toml — Satty 0.22 (Super+Print). Enter = copy & close, Ctrl+S = save.
[general]
initial-tool = "arrow"
copy-command = "wl-copy"
annotation-size-factor = 1.5
early-exit = ["all"]
actions-on-enter = ["save-to-clipboard"]
actions-on-escape = ["exit"]
corner-roundness = 10
no-window-decoration = true
floating-hack = true
primary-highlighter = "block"

[font]
family = "Noto Sans"
style = "Bold"

[color-palette]
# toolbar swatches: vermilion, yamabuki, matcha, indigo, kinari (paper)
palette = ["#eb5324ff", "#e2b540ff", "#8fa071ff", "#97acc8ff", "#f1e1b4ff"]
