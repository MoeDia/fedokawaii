# ~/.config/foot/foot.ini — foot 1.27/1.28. Validate: foot --check-config
# Runs as a server (autostart: foot --server); Super+Return opens footclient windows.

[main]
# the dark or light palette to start in (kawa-theme rewrites it through that link)
include=~/.config/fedokawaii/current/foot.ini
# Sumi Term at 16 px: UDEV Gothic NF (fontconfig's alias: system/60-fedokawaii-pixel.conf) —
# JetBrains Mono's letters, BIZ UDGothic's Japanese, the Nerd Font symbols (Neovim's LazyVim
# icons, the signs, the dashboard): a cell of 8 × 20 (docs/design-system.md §2–§3 — the cell of
# every surface), Japanese two cells, no ligatures (== and -> stay what they are). Its own
# Bold, Italic and Bold Italic carry emphasis. Then the desktop's pixel icons (prompt, fetch,
# the pop-ups, yazi's file kinds — tools/build-icons.py): the UI's 12 × 12 drawings pixel for
# pixel, each centred in two cells, its middle on the capitals' middle.
# On a screen at scale 2 (a 2160p one), foot draws every size twice as large. Ctrl+plus/minus
# change it 2 px at a time (16, 18, 20 px: an 8, 9, 10 px cell, whole pixels); Ctrl+0 back here
font=Sumi Term:pixelsize=16,Sumi Icons Term:pixelsize=16
# the line the design's row (20 px): the face's 15.33 + 3.25 px round to 16 + 4 — its baseline
# 16 px down, capitals on rows 4–15 (their middle the line's), foot's box lines on row 10
line-height=20px
font-size-adjustment=2px
# 8 px of paper round the text (a screen keeps one cell more of its own: 16 to the words, as a
# panel's pad), the text held to the top-left corner: centred, it moved by a few pixels every
# time a window changed size (a new layout, a window more or less)
pad=8x8
# selecting text also fills the clipboard
selection-target=clipboard

[scrollback]
lines=20000
indicator-position=relative

[cursor]
# a solid vermilion block, like an old terminal
style=block
blink=yes

[mouse]
hide-when-typing=yes

[url]
launch=xdg-open ${url}

# Ctrl+Shift+Y (below): every commit hash, IP address and path on screen gets a short label;
# type it and that text is on the clipboard — no mouse, no careful selecting
[regex:copy]
regex=([0-9a-f]{7,40}|[0-9]{1,3}(\.[0-9]{1,3}){3}|~?/[-./_[:alnum:]]+)

[security]
# programs in the terminal may put text on the clipboard (neovim over SSH does), but never
# read it: a file you cat, or a server you ssh into, cannot see what you copied
osc52=copy-enabled

[bell]
# bell in an unfocused window → its workspace turns teal (urgent) in the bar
urgent=yes

# >>> colours: generated by tools/build-themes.py — edit the palette there
# Both palettes live here; foot starts in the one named by the include above and
