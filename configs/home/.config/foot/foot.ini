# ~/.config/foot/foot.ini — foot 1.27/1.28. Validate: foot --check-config
# Runs as a server (autostart: foot --server); Super+Return opens footclient windows.

[main]
# the dark or light palette to start in (kawa-theme rewrites it through that link)
include=~/.config/fedokawaii/current/foot.ini
# Sumi Term at 20 px: Kappa 20 Bold, kterm's own Japanese face (tools/build-fonts.py) — drawn
# for exactly this size: every pixel a screen pixel, its upright strokes two wide, capitals 14
# px tall; Latin a 10 px cell, Japanese two (a 24" 1080p screen shows 188 × 43 of them
# full-screen). Then the desktop's pixel icons (prompt, fetch, the pop-ups, yazi's file
# kinds), built on this font's grid (tools/build-icons.py): a 14 × 14 icon within two cells,
# as tall as the capitals. Last, JetBrainsMono Nerd, for one user
# only: Neovim's LazyVim plugins draw Nerd Font symbols (Private Use Area, U+E000–U+F8FF and
# U+F0001–U+F1AF0 — mini.icons' file-type icons in the pickers and the explorer, which-key's
# group icons, the diagnostic and git signs, lazy.nvim's plugin list, the dashboard). Nothing
# else in the terminal asks for one: yazi's file kinds are Sumi Icons, lazygit's icons are
# off, eza and btop draw none. Named here at 17 px, where its advance (0.6 em) is the cell's
# 10 px: left to fontconfig's fallback, the same glyphs came at 20 px, wider than the cell.
# (The font itself stays installed regardless: it is GTK's and Qt's monospace, mpv's and
# Syncplay's on-screen text — fonts.conf, lib/manifest.sh.) Sumi Term has one face, upright and
# already bold: bold and italic text stay in it (thickened further or slanted, a dot font
# smears), and the colours carry the emphasis.
# On a screen at scale 2 (a 2160p one), foot draws every size twice as large: 40 px, still
# whole pixels. Ctrl+plus/minus change it a whole size at a time (20, 40, 60 px: crisp at
# every step); Ctrl+0 comes back here
font=Sumi Term:pixelsize=20,Sumi Icons Term:pixelsize=20,JetBrainsMono Nerd Font:pixelsize=17
font-bold=Sumi Term:pixelsize=20,Sumi Icons Term:pixelsize=20,JetBrainsMono Nerd Font:pixelsize=17
font-italic=Sumi Term:pixelsize=20,Sumi Icons Term:pixelsize=20,JetBrainsMono Nerd Font:pixelsize=17
font-bold-italic=Sumi Term:pixelsize=20,Sumi Icons Term:pixelsize=20,JetBrainsMono Nerd Font:pixelsize=17
# the face's own lines are exactly its 20 px, so a line's tallest glyphs (kanji, the
# bars) touched the next one's: 4 px of air between lines
line-height=24px
font-size-adjustment=20px
# 10 px of paper round the text, the text held to the top-left corner: centred, it moved by a
# few pixels every time a window changed size (a new layout, a window more or less)
pad=10x10
# selecting text also fills the clipboard
selection-target=clipboard

[scrollback]
lines=20000
indicator-position=relative

[cursor]
# a solid vermilion block, like an old terminal
style=block
blink=yes

[mouse]
hide-when-typing=yes

[url]
launch=xdg-open ${url}

# Ctrl+Shift+Y (below): every commit hash, IP address and path on screen gets a short label;
# type it and that text is on the clipboard — no mouse, no careful selecting
[regex:copy]
regex=([0-9a-f]{7,40}|[0-9]{1,3}(\.[0-9]{1,3}){3}|~?/[-./_[:alnum:]]+)

[security]
# programs in the terminal may put text on the clipboard (neovim over SSH does), but never
# read it: a file you cat, or a server you ssh into, cannot see what you copied
osc52=copy-enabled

[bell]
# bell in an unfocused window → its workspace turns teal (urgent) in the bar
urgent=yes

# >>> colours: generated by tools/build-themes.py — edit the palette there
# Both palettes live here; foot starts in the one named by the include above and
