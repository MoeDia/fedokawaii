[key-bindings]
# defaults kept: Ctrl+Shift+N new window here (OSC 7) · Ctrl+Shift+Z/X previous/next prompt (OSC 133)
# Ctrl+Shift+R search · Ctrl+Shift+O open URL · Ctrl+plus/minus/0 font size
pipe-command-output=[sh -c 'f=$(mktemp); cat >"$f"; footclient nvim "$f"; rm -f "$f"'] Control+Shift+g
regex-copy=[copy] Control+Shift+y
