# ~/.config/mpv/mpv.conf — mpv 0.41. Video output and decoding stay on mpv's own probing
# (gpu-next, then gpu; Vulkan, then OpenGL), so a machine whose Vulkan fails still shows
# the picture. Values holding a "#" are quoted whole: in this file an unquoted # starts a
# comment. Colours: the theme's, from the include at the end; subtitles keep their own.
hwdec=vaapi                       # VA-API decoding (Mesa on AMD, intel-media-driver on Intel); software if it fails
@MPV_SCALING@
video-sync=display-resample       # timed to the monitor, so motion is even
interpolation=yes

# sound (PipeWire)
volume=80
volume-max=150

# subtitles — Latin in Noto Sans; Arabic and Japanese / Chinese / Korean from fontconfig's
# fallbacks (Noto Naskh Arabic, Noto Sans CJK); the theme's paper and ink
sub-auto=fuzzy
sub-font="Noto Sans"
sub-font-size=44
sub-outline-size=2
sub-color="#f1e1b4"
sub-outline-color="#181715"
slang=en,eng,ar,ara
alang=en,eng,ar,ara

# on-screen text and controller
osd-font="JetBrainsMono Nerd Font"
osd-font-size=28
osd-bar-align-y=0.9
keep-open=yes                     # the last file stays on its last frame (scripts/kawa-resume.lua:
save-position-on-quit=yes         # one watched to the end starts from the beginning next time)
screenshot-format=png
screenshot-dir=~/Pictures/Screenshots

# web video through yt-dlp (its own ~/.config/yt-dlp/config is read too)
ytdl-format=bestvideo[height<=?2160]+bestaudio/best

# the current theme's colours: on-screen text, controller, menus (dark or light). kawa-theme
# hands a switch to every open player (scripts/kawa-ipc.lua)
include="~~home/../fedokawaii/current/mpv.conf"
