# ~/.config/mpv/script-opts/syncplayintf.conf — Syncplay's words on the film (its script in
# mpv, syncplayintf.lua: "connected to…", who joined, the chat) in mpv's own on-screen font,
# from the first frame. Syncplay tells mpv its own settings a moment after mpv opens — the
# same font, in ~/.config/syncplay.ini (theme.sh) — and until then the script would draw
# them in its own default ("sans serif"), which then changed under your eyes.
chatInputFontFamily=JetBrainsMono Nerd Font
chatOutputFontFamily=JetBrainsMono Nerd Font
