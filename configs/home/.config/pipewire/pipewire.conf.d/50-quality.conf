# ~/.config/pipewire/pipewire.conf.d/50-quality.conf — what you hear, untouched.
# The rate: 48 kHz (calls, games, Brave, Spotify's web player) unless a sound at another rate
# plays alone — mpv with a 44.1 kHz FLAC, a 96 kHz file — then PipeWire runs the card at that
# rate (it switches only while nothing plays, so the switch is never heard), and the music is
# not resampled at all. A rate the card cannot take: PipeWire stays at 48 kHz.
# The period (the quantum): 1024 samples (21 ms) while nothing asks for less — the fewest
# wake-ups; a call or a game asks for less and gets it, but never below 256 (5.3 ms): below
# that the analog card crackles while the GPU is busy (pipewire-pulse, for Brave and Steam,
# keeps the same floor already).
# The resampler, where one is still needed (two programs at different rates at once):
# quality 10 of 14 (PipeWire's default is 4), here for PipeWire's own streams — the clean mic
# (60-clean-mic.conf) and "Share" (60-share.conf); the same line in
# ~/.config/pipewire/pipewire-pulse.conf.d/50-quality.conf and client.conf.d/50-quality.conf
# for the programs (Pulse ones: Brave, Steam; PipeWire's own: mpv). It costs processor time
# only while it resamples.
context.properties = {
  default.clock.rate          = 48000
  default.clock.allowed-rates = [ 44100 48000 88200 96000 ]
  default.clock.quantum       = 1024
  default.clock.min-quantum   = 256
  default.clock.max-quantum   = 2048
}
stream.properties = {
  resample.quality = 10
}
