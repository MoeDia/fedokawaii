# ~/.config/pipewire/pipewire.conf.d/60-share.conf — sharing sound in calls.
# Brave shares a tab's sound by itself, and a whole screen's with its system-audio switch
# (the handbook: "Screen sharing"). Apps that only take a microphone (Discord, Zoom, OBS…)
# get this instead:
#   "Share"             an output: move a game, a video, music to it in the mixer, wiremix
#                       (Playback tab) — you still hear it on your own speakers
#   "Monitor of Share"  PipeWire's own twin of every output: pick it as the microphone (or a
#                       second audio source) in the call app — it carries only what you moved
#                       to "Share"
# Only what you route is shared, never the call itself, so nobody hears their own voice
# come back. "Share" never becomes the default output (priority 0; your sound card's is higher).
#
# One loopback, playing into your speakers. A second loopback that recorded "Share" as a
# virtual microphone crashed PipeWire 1.6 (Fedora 44) the moment WirePlumber configured it
# (pw_impl_port_destroy, a segfault at every start: no sound at all) — the monitor does the
# same job with nothing extra running.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Share"
      capture.props = {
        node.name        = "share_sink"
        media.class      = "Audio/Sink"
        priority.session = 0             # never chosen as the default output
        audio.position   = [ FL FR ]
      }
      playback.props = {
        node.name      = "share_sink.out"
        node.passive   = true
        audio.position = [ FL FR ]
      }
    }
  }
]
