# ~/.config/pipewire/pipewire.conf.d/60-share.conf — sharing sound in calls.
# Brave shares a tab's sound by itself, and a whole screen's with its system-audio switch
# (the handbook: "Screen sharing"). Apps that only take a microphone (Discord, Zoom, OBS…)
# get these two instead:
#   "Share"                 an output: move a game, a video, music to it in pavucontrol
#                           (Playback tab) — you still hear it on your own speakers
#   "Share (as microphone)" an input carrying only what you moved to "Share": pick it as
#                           the microphone (or a second audio source) in the app
# Only what you route is shared, never the call itself, so nobody hears their own voice
# come back. Neither ever becomes a default device (priority 0; your sound card's is higher).
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Share"
      capture.props = {
        node.name       = "share_sink"
        media.class     = "Audio/Sink"
        priority.session = 0             # never chosen as the default output
        audio.position  = [ FL FR ]
      }
      playback.props = {
        node.name      = "share_sink.out"
        node.passive   = true
        audio.position = [ FL FR ]
      }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "Share (as microphone)"
      capture.props = {
        node.name           = "share_source.in"
        stream.capture.sink = true
        target.object       = "share_sink"
        node.passive        = true
        audio.position      = [ FL FR ]
      }
      playback.props = {
        node.name       = "share_source"
        media.class     = "Audio/Source/Virtual"
        priority.session = 0             # never chosen as the default microphone
        audio.position  = [ FL FR ]
      }
    }
  }
]
