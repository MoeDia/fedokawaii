# ~/.config/pipewire/pipewire.conf.d/60-clean-mic.conf — the clean mic: your microphone with
# the room taken out, for calls (Discord and Meet in Brave), games' voice chat, recordings.
#   "Clean mic"  an input (node clean_mic): the microphone through WebRTC's audio processing —
#                the same code Chromium and Meet run — inside PipeWire: a high-pass filter
#                (rumble, a desk's knocks), noise suppression (a fan, the PC, the street), echo
#                cancellation against what your computer plays (a call heard on speakers never
#                comes back to the others; on headphones it stays out of the way)
# It is the default input; the sound panel's "clean mic" key (Super+A, under 入 input) puts
# the raw microphone back as the default, and again the clean one — WirePlumber remembers the
# choice across restarts. The raw microphone stays in every list, for a program you want it
# in. Its level: the raw microphone's (the panel's test mic says how it sounds).
# One module, no extra package: PipeWire's echo-cancel with its WebRTC library (pipewire-libs
# ships aec/libspa-aec-webrtc.so, built on webrtc-audio-processing). RNNoise would need
# noise-suppression-for-voice, which Fedora does not package.
# What it costs: nothing while no program records from it (both streams it reads are
# passive: the microphone is not even opened); while one does, one mono 48 kHz stream through
# WebRTC — about 1 % of one core. What you hear is never touched: in monitor mode it listens
# to the default output (as cava does) instead of putting a sink of its own in front of it.
# No automatic gain: Brave applies its own when a call asks (Meet always does; Discord's
# switch), and two in a row pump the level up and down.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name   = aec/libspa-aec-webrtc
      monitor.mode   = true
      audio.rate     = 48000
      audio.channels = 1
      audio.position = [ MONO ]
      aec.args = {
        webrtc.high_pass_filter  = true
        webrtc.noise_suppression = true
        webrtc.gain_control      = false
      }
      capture.props = {
        node.name        = "clean_mic.capture"
        node.description = "Clean mic (the raw microphone)"
        node.passive     = true
      }
      source.props = {
        node.name        = "clean_mic"
        node.description = "Clean mic"
        priority.session = 3000          # above every sound card's microphone (ALSA's: about 2000)
      }
      sink.props = {
        node.name        = "clean_mic.reference"
        node.description = "Clean mic (what plays, to cancel)"
        node.passive     = true
      }
    }
  }
]
