# ~/.config/yazi/theme.toml — yazi (Super+E) in the desktop's colours. Every colour is one
# of the terminal's, by name or by its number in foot's palette, so an open yazi switches
# with the dark and light theme exactly like the shell, bat and the code previews (yazi's
# built-in "ansi" highlighting, used while syntect_theme is empty). The design system's roles
# are foot's 18–25 (tools/build-themes.py): 18 edge · 19 edge2 · 20 accent_text · 21 muted ·
# 22 faint · 23 strong · 24 select (the lacquer) · 25 text_on_select — as fzf's colours.
#   red = vermilion · lightcyan = asagi
# For yazi 26.x (sections [mgr], [pick], [cmp]); yazi names any key it does not know.

[mgr]
cwd            = { fg = "23" }
find_keyword   = { fg = "lightred", bold = true, underline = true }
find_position  = { fg = "lightcyan", bg = "reset", bold = true }
symlink_target = { fg = "darkgray", italic = true }
# a mark: half a cell of its ink against the row, on the rail's column (copied, cut, marked, selected)
marker_copied   = { fg = "green" }
marker_cut      = { fg = "red" }
marker_marked   = { fg = "lightcyan" }
marker_selected = { fg = "yellow" }
marker_symbol   = "▐"
count_copied   = { fg = "21" }
count_cut      = { fg = "21" }
count_selected = { fg = "21" }
border_symbol = "│"
border_style  = { fg = "19" }
syntect_theme = ""

# tabs and the mode badge are lit keys, like the bar's: vermilion in normal mode, asagi
# while selecting, ochre while unselecting
[tabs]
active    = { fg = "black", bg = "red", bold = true }
inactive  = { fg = "gray", bg = "black" }
sep_inner = { open = "", close = "" }
sep_outer = { open = " ", close = "" }   # one free column before the first tab, as on every row

[mode]
# the status line is a text screen's footer (§7): words in muted, no blocks of colour; the
# mode's name alone in accent_text (vermilion), as a list's search line has its chevron
normal_main = { fg = "red" }
normal_alt  = { fg = "darkgray" }
select_main = { fg = "lightcyan" }
select_alt  = { fg = "darkgray" }
unset_main  = { fg = "yellow" }
unset_alt   = { fg = "darkgray" }

# the row under the cursor: the lacquer, every ink on it text_on_select (§4: what is selected),
# as fzf's cursor; a place in another folder — the one you are in, in the parent column, and
# where you would land in the preview's — the edge behind it, quiet, its words strong (the
# kinds' colours stay on the rows at rest: on a band, a folder's blue falls under 4.5 : 1).
# padding: the bar's first and last cells, drawn in the bar's colour — a full block keeps the
# row's name in the same column as its neighbours' ("" would pull it one column left)
[indicator]
parent  = { bg = "18", fg = "23" }
current = { bg = "24", fg = "25" }
preview = { bg = "18", fg = "23" }
padding = { open = "█", close = "█" }

[status]
overall         = {}
sep_left        = { open = "", close = "" }
sep_right       = { open = "", close = "" }
perm_sep        = { fg = "darkgray" }
perm_type       = { fg = "darkgray" }
perm_read       = { fg = "darkgray" }
perm_write      = { fg = "darkgray" }
perm_exec       = { fg = "darkgray" }
progress_label  = { bold = true }
progress_normal = { fg = "red", bg = "black" }
progress_error  = { fg = "yellow", bg = "red" }

# pop-ups (the patched yazi, src/yazi/yazi.patch, draws them as §4's panels): 31 the hairline of what floats; a
# heading's name strong (23), a key in the words' own ink, what it does muted (21), the cursor's row 24 and 25
[which]
border          = { fg = "31" }
cols            = 3
mask            = {}
cand            = {}
rest            = {}
desc            = { fg = "21" }
separator       = "  "
separator_style = {}

[confirm]
border     = { fg = "31" }
title      = { fg = "23" }
body       = { fg = "21" }
list       = {}
btn_yes    = {}
btn_no     = {}
btn_labels = [ "y", "n" ]

[spot]
border   = { fg = "31" }
title    = { fg = "23" }
tbl_col  = { fg = "21" }
tbl_cell = { bg = "24", fg = "25" }

[notify]
# a notice's ring in the hairline, an error's in the seal's red; the heading's icon the desktop's own
title_info  = { fg = "31" }
title_warn  = { fg = "31" }
title_error = { fg = "16" }
icon_info   = "\U000FE028"
icon_warn   = "\U000FE028"
icon_error  = "\U000FE050"

[pick]
border   = { fg = "31" }
active   = { bg = "24", fg = "25" }
inactive = {}

[input]
border   = { fg = "31" }
title    = { fg = "23" }
value    = {}
selected = { bg = "18" }

[cmp]
border   = { fg = "31" }
active   = { bg = "24", fg = "25" }
inactive = {}

[tasks]
border  = { fg = "31" }
title   = { fg = "23" }
hovered = { bg = "24", fg = "25" }

[help]
border  = { fg = "31" }
chord   = { fg = "21" }
action  = {}
hovered = { bg = "24", fg = "25" }

# file names by kind; folders in blue, like ls — each kind in its brighter slot (in light the
# brighter slots are the deeper inks): at rest every name ≥ 4.5 : 1 on its ground in both moods
# (the regular ones fell to 3.5–4.3 on the light paper: pictures, scripts, media, folders).
# Programs and scripts keep the words' ink: their icon says what they are, and no green of the
# palette reaches 4.5 : 1 on the light paper (4.09, its brighter one 4.47)
[filetype]
rules = [
	{ mime = "**/image/*", fg = "lightyellow" },
	{ mime = "**/{audio,video}/*", fg = "lightmagenta" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "red" },
	{ mime = "**/application/{pdf,doc,rtf,epub+zip}", fg = "cyan" },
	{ mime = "vfs/{absent,stale}", fg = "darkgray" },
	# a broken link, and what cannot be read: vermilion, struck through. (Not ink on a red
	# bar: under the cursor the row takes the selection ink as its ground, and ink letters
	# on it would vanish.)
	{ url = "*", is = "orphan", fg = "red", crossed = true },
	{ url = "*", is = "dummy", fg = "red", crossed = true },
	{ url = "*/", is = "dummy", fg = "red", crossed = true },
	# what starts with a dot steps back (the owner keeps them shown): folders and files muted
	{ url = ".*/", fg = "21" },
	{ url = ".*", fg = "21" },
	{ url = "*/", fg = "lightblue", bold = true },
]

# icons: the desktop's own pixel icons (Sumi Icons, the font of the bar and the menus;
# art/icons.txt), one a kind, each in the colour of the name beside it. All are drawn on
# the same 10 × 10 grid, so every name starts the same distance from its icon — two spaces
# after it, as in every menu (the icon is drawn wider than its cell: one space would be half
# under it). Written as their code points (U+FE000 onwards): icons.sh names them.
[icon]
globs = []
files = []
