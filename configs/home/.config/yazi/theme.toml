# ~/.config/yazi/theme.toml — yazi (Super+E) in the desktop's colours. Every colour is one
# of the terminal's 16, by name, so it is foot's palette: an open yazi switches with the
# dark and light theme exactly like the shell, bat and the code previews (yazi's built-in
# "ansi" highlighting, used while syntect_theme is empty).
#   black = the selection ink · red = vermilion · lightcyan = asagi · darkgray = rules
# For yazi 26.x (sections [mgr], [pick], [cmp]); yazi names any key it does not know.

[mgr]
cwd            = { fg = "white", bold = true }
find_keyword   = { fg = "lightred", bold = true, underline = true }
find_position  = { fg = "lightcyan", bg = "reset", bold = true }
symlink_target = { fg = "darkgray", italic = true }
marker_copied   = { fg = "green",     bg = "green" }
marker_cut      = { fg = "red",       bg = "red" }
marker_marked   = { fg = "lightcyan", bg = "lightcyan" }
marker_selected = { fg = "yellow",    bg = "yellow" }
marker_symbol   = "│"
count_copied   = { fg = "black", bg = "green" }
count_cut      = { fg = "black", bg = "red" }
count_selected = { fg = "black", bg = "yellow" }
border_symbol = "│"
border_style  = { fg = "darkgray" }
syntect_theme = ""

# tabs and the mode badge are lit keys, like the bar's: vermilion in normal mode, asagi
# while selecting, ochre while unselecting
[tabs]
active    = { fg = "black", bg = "red", bold = true }
inactive  = { fg = "gray", bg = "black" }
sep_inner = { open = "", close = "" }
sep_outer = { open = " ", close = "" }   # one free column before the first tab, as on every row

[mode]
normal_main = { fg = "black", bg = "red", bold = true }
normal_alt  = { fg = "red", bg = "black" }
select_main = { fg = "black", bg = "lightcyan", bold = true }
select_alt  = { fg = "lightcyan", bg = "black" }
unset_main  = { fg = "black", bg = "yellow", bold = true }
unset_alt   = { fg = "yellow", bg = "black" }

# the row under the cursor: the selection ink behind it; the file keeps its own colour.
# padding: the bar's first and last cells, drawn in the bar's colour — a full block keeps the
# row's name in the same column as its neighbours' ("" would pull it one column left)
[indicator]
parent  = { bg = "black" }
current = { bg = "black", bold = true }
preview = { underline = true }
padding = { open = "█", close = "█" }

[status]
overall         = {}
sep_left        = { open = "", close = "" }
sep_right       = { open = "", close = "" }
perm_sep        = { fg = "darkgray" }
perm_type       = { fg = "blue" }
perm_read       = { fg = "yellow" }
perm_write      = { fg = "red" }
perm_exec       = { fg = "green" }
progress_label  = { bold = true }
progress_normal = { fg = "red", bg = "black" }
progress_error  = { fg = "yellow", bg = "red" }

# pop-ups: a hairline in the text colour, titles in the strongest ink, keys in asagi
[which]
border          = { fg = "gray" }
cols            = 3
mask            = {}
cand            = { fg = "lightcyan" }
rest            = { fg = "darkgray" }
desc            = { fg = "gray" }
separator       = "  "
separator_style = { fg = "darkgray" }

[confirm]
border     = { fg = "gray" }
title      = { fg = "white" }
body       = {}
list       = {}
btn_yes    = { fg = "black", bg = "red" }
btn_no     = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[spot]
border   = { fg = "gray" }
title    = { fg = "white" }
tbl_col  = { fg = "lightcyan" }
tbl_cell = { fg = "black", bg = "yellow" }

[notify]
title_info  = { fg = "green" }
title_warn  = { fg = "yellow" }
title_error = { fg = "red" }

[pick]
border   = { fg = "gray" }
active   = { fg = "lightred", bold = true }
inactive = {}

[input]
border   = { fg = "gray" }
title    = { fg = "white" }
value    = {}
selected = { bg = "black" }

[cmp]
border   = { fg = "gray" }
active   = { bg = "black", bold = true }
inactive = {}

[tasks]
border  = { fg = "gray" }
title   = { fg = "white" }
hovered = { fg = "lightred", bold = true }

[help]
border  = { fg = "gray" }
chord   = { fg = "lightcyan" }
action  = {}
hovered = { bg = "black", bold = true }

# file names by kind; folders in blue, like ls
[filetype]
rules = [
	{ mime = "**/image/*", fg = "yellow" },
	{ mime = "**/{audio,video}/*", fg = "magenta" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "red" },
	{ mime = "**/application/{pdf,doc,rtf,epub+zip}", fg = "cyan" },
	{ mime = "vfs/{absent,stale}", fg = "darkgray" },
	# a broken link, and what cannot be read: vermilion, struck through. (Not ink on a red
	# bar: under the cursor the row takes the selection ink as its ground, and ink letters
	# on it would vanish.)
	{ url = "*", is = "orphan", fg = "red", crossed = true },
	{ url = "*", is = "exec", fg = "green" },
	{ url = "*", is = "dummy", fg = "red", crossed = true },
	{ url = "*/", is = "dummy", fg = "red", crossed = true },
	{ url = "*/", fg = "blue", bold = true },
]

# icons: the desktop's own pixel icons (Sumi Icons, the font of the bar and the menus;
# art/icons.txt), one a kind, each in the colour of the name beside it. All are drawn on
# the same 10 × 10 grid, so every name starts the same distance from its icon. Written as
# their code points (U+FE000 onwards): icons.sh names them.
