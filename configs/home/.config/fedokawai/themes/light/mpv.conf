# ~/.config/fedokawai/current/mpv.conf — mpv's colours in washi (paper). Generated by tools/build-themes.py; edit the palette there.
# Read by ~/.config/mpv/mpv.conf (include) and handed to open players by kawa-theme.
# On-screen text and menus: ink with a ground outline, vermilion for the chosen row ·
# controller: the ground behind, title and time in ink (they sit over the picture too, so
# they take the strongest contrast), buttons in the text colour, teal while held.
# Every value holding a "#" is quoted whole (an unquoted # starts a comment in mpv).
osd-color="#0f0e0c"
osd-outline-color="#e9e1cb"
osd-back-color="#dcd2b8"
osd-selected-color="#c0462a"
osd-selected-outline-color="#e9e1cb"
script-opt="osc-background_color=#e9e1cb"
script-opt="osc-title_color=#0f0e0c"
script-opt="osc-timecode_color=#0f0e0c"
script-opt="osc-time_pos_color=#0f0e0c"
script-opt="osc-time_pos_outline_color=#e9e1cb"
script-opt="osc-buttons_color=#2b2721"
script-opt="osc-small_buttonsL_color=#2b2721"
script-opt="osc-small_buttonsR_color=#2b2721"
script-opt="osc-top_buttons_color=#2b2721"
script-opt="osc-held_element_color=#2f6e67"
script-opt="console-focused_color=#fbf7ec"
script-opt="console-focused_back_color=#c0462a"
script-opt="console-match_color=#2f6e67"
script-opt="context_menu-focused_color=#fbf7ec"
script-opt="context_menu-focused_back_color=#c0462a"
