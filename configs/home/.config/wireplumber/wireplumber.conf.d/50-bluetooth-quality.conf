# ~/.config/wireplumber/wireplumber.conf.d/50-bluetooth-quality.conf — Bluetooth audio at the
# best each pair of headphones can take (WirePlumber 0.5).
# The codecs, best first: LDAC, aptX HD, aptX, AAC, then SBC-XQ — SBC at the highest bitpool
# the standard allows, which every headphone can play, and which sounds close to aptX — and
# plain SBC last. LDAC at its highest rate (990 kb/s: "hq") rather than the adaptive default,
# which drops to 330 kb/s at the first doubt; it holds over a few metres of open air (should
# a room need less: `pactl list cards` names the headphones' profiles, one per codec, and
# `pactl set-card-profile CARD a2dp-sink-aac` takes another).
# The headset profile's wideband speech (mSBC) for calls; volume on the headphones' own
# buttons and in the bar kept as one (hardware volume).
monitor.bluez.properties = {
  bluez5.codecs = [ ldac aptx_hd aptx aac sbc_xq sbc ]
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
}
monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        bluez5.a2dp.ldac.quality = "hq"
      }
    }
  }
]
