# shoot.sh's compositor: headless sway standing in for dwl. One 1920×1080 output at scale 1,
# no bar of its own, no gaps. foot windows float at fixed sizes for the shots.
output HEADLESS-1 resolution 1920x1080 position 0 0 scale 1
swaybg_command -
# dwl's frame around every window, as dwl draws it (src/dwl/config.h: borderpx 2, the
# focused window SHU, the others NEZUMI, one asking for attention ASAGI — dwl.patch makes
# it one closed 2-px border with all three of its colours the same): a 2-px border, corners
# filled. The window sizes below are the content's; the frame goes around it.
default_border pixel 2
default_floating_border pixel 2
client.focused          #d0583a #d0583a #ece3cc #d0583a #d0583a
client.focused_inactive #877f6f #877f6f #ece3cc #877f6f #877f6f
client.unfocused        #877f6f #877f6f #ece3cc #877f6f #877f6f
client.urgent           #7fb8b0 #7fb8b0 #0f0e0c #7fb8b0 #7fb8b0
gaps inner 0
gaps outer 0
focus_follows_mouse no
xwayland disable
seat * hide_cursor 1

for_window [app_id="^footclient$"] floating enable, resize set 1104 704, move position center
for_window [app_id="^swatch$"] floating enable, resize set 864 364, move position center
for_window [app_id="^float$"] floating enable, move position center
