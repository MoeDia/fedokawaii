# fedokawai.conf — the only file to edit. Every value is validated before anything runs.

USERNAME=""                       # empty = the user who ran sudo
GPU="auto"                        # auto | amd | intel
STEAM="yes"                       # yes | no — Steam, gamescope, gamemode, MangoHud, GE-Proton
SSH_SERVER="no"                   # yes | no — a desktop doesn't need inbound SSH; "no" disables sshd
                                  #             and closes ssh/cockpit in the firewall

MONITOR_HZ="144"                  # target refresh rate (the highest mode ≤ this is used)
KB_LAYOUTS="us,ara"               # XKB layouts; the first is also used for keybindings
KB_TOGGLE="grp:alt_shift_toggle"  # layout switch: Alt+Shift
TIMEZONE="Asia/Dubai"
WEATHER_CITY="Sharjah"            # bar weather (wttr.in)
NIGHT_LIGHT="25.35:55.40"         # gammastep latitude:longitude

THEME="dark"                      # dark | light — the theme a new install starts in; switch any
                                  #   time in quick settings (the ⌄ key in the bar) → theme
WALLPAPER_PACK="yes"              # yes | no — fetch 70 wallpapers from GitHub (about 210 MB, once)
                                  #   and redraw them as pixel art for the two themes
BOOT_MENU_SECONDS="2"             # 0–10 — how long the themed boot menu shows; 0 = hidden, as
                                  #   Fedora does (it appears only after a failed boot or with Esc)

DNF_PARALLEL="10"                 # parallel downloads (1–20)

DWL_TAG="v0.9"                                         # dwl 0.9 builds against wlroots 0.20.x;
DWL_COMMIT="98bea2c27f99c549023fb394bfd983a439d8ccb9"  # the tag must resolve to exactly this commit
DWL_WLROOTS="0.20"                                     # Fedora 44 and 45 ship wlroots 0.20.2; dwl keeps
                                                       #   its own copy for later releases (setup.sh)
TFC_TAG="v1.4.3"                                       # the yazi file dialog (xdg-desktop-portal-termfilechooser,
TFC_COMMIT="cb8cec0b30aa6e2cc36b1b5cb34d6dc9a1face29"  # hunkyburrito's fork); the tag must resolve to this commit
