# iso/ks.cfg — the installer's kickstart: this PC's layout (UEFI, GPT, /boot outside Btrfs, one Btrfs
# subvolume "root" with /home in it: the same as tools/vm-create.sh's), the answers from our own
# screen (iso/screens/questions.py, in %pre), the first start's setup enabled in %post.
# @…@ is filled by tools/build-iso.sh.
text --non-interactive
lang en_US.UTF-8
url --metalink="https://mirrors.fedoraproject.org/metalink?repo=fedora-@RELEASE@&arch=x86_64"
repo --name=updates --metalink="https://mirrors.fedoraproject.org/metalink?repo=updates-released-f@RELEASE@&arch=x86_64"
rootpw --lock
firstboot --disable
selinux --enforcing
zerombr
clearpart --all --initlabel --disklabel=gpt
part /boot/efi --fstype=efi --size=600
part /boot --fstype=xfs --size=2048
part btrfs.01 --fstype=btrfs --grow
btrfs none --label=fedora btrfs.01
btrfs / --subvol --name=root fedora
%include /tmp/answers.ks
reboot --eject

%pre --interpreter=/usr/bin/python3 --erroronfail --log=/tmp/fk-pre.log
import runpy
runpy.run_path("/usr/share/fedokawaii-iso/questions.py", run_name="__main__")
%end

%packages
@^custom-environment
plymouth-plugin-script
python3
-kmscon
%end

%post --nochroot --erroronfail --log=/mnt/sysimage/var/log/fk-post.log --interpreter=/usr/bin/bash
/usr/bin/bash /usr/share/fedokawaii-iso/post.sh
%end

%onerror --interpreter=/usr/bin/python3
import runpy
runpy.run_path("/usr/share/fedokawaii-iso/failed.py", run_name="__main__")
%end
