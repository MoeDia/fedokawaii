# the boot menu of the fedokawaii installer (iso/grub.cfg; tools/build-iso.sh fills @…@). The menu's
# words are icons of the theme, PNG, its entries' titles empty: under Secure Boot Fedora's GRUB loads
# no font but its own Unifont, and PNG it does (iso-research.md §5).
set default="0"
set timeout=5
search --no-floppy --set=root -l '@VOLID@'
# (first the kernel and the initrd, 280 MB, under the firmware's own picture: done from the menu, GRUB
# would show its terminal over it all that time. The menu's first line then only has to go: an entry
# with something loaded boots it)
linux /images/pxeboot/vmlinuz @ARGS@
initrd /images/pxeboot/initrd.img /images/pxeboot/fedokawaii-boot.img
function load_video {
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod all_video
}
load_video
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod ext2
insmod png
insmod gfxterm
insmod gfxmenu
set gfxmode=auto
terminal_output gfxterm
# (GRUB's terminal, the window it paints over the menu when an entry starts and that stays up while the
# kernel unpacks the initrd, seconds, black: the signed image has no command for its ground, and refuses
# modules under Secure Boot. Anywhere else this one, of GRUB's own build, makes it the ground. Under
# Secure Boot it stays black, for those seconds)
if [ "$lockdown" != "y" ]; then
  set prefix=($root)/boot/grub2
  insmod gfxterm_background
  background_color "#@GROUND@"
fi
set theme=($root)/boot/grub2/themes/fedokawaii/theme.txt
menuentry ' ' --class fkinstall {
	boot
}
menuentry ' ' --class fkcheck {
	linux /images/pxeboot/vmlinuz @ARGS@ fk.check
	initrd /images/pxeboot/initrd.img /images/pxeboot/fedokawaii-boot.img
	boot
}
