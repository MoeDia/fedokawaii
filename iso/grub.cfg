# the boot menu of the fedokawaii installer (iso/grub.cfg; tools/build-iso.sh fills @…@). The menu's
# words are icons of the theme, PNG, its entries' titles empty: under Secure Boot Fedora's GRUB loads
# no font but its own Unifont, and PNG it does (iso-research.md §5).
set default="0"
set timeout=5
# (grub_cls only clears when this is empty, and it is what paints the terminal's black window when an entry
# starts: normal/term.c. No facility has this name, so GRUB says nothing more; the menu stays until the splash)
set debug=fedokawaii
search --no-floppy --set=root -l '@VOLID@'
# (first the kernel and the initrd, 280 MB, under the firmware's own picture: done from the menu, GRUB
# would show its terminal over it all that time, a black window the signed image cannot change or
# hide. The menu's first line then only has to go: an entry with something loaded boots it)
linux /images/pxeboot/vmlinuz @ARGS@
initrd /images/pxeboot/initrd.img /images/pxeboot/fedokawaii-boot.img
function load_video {
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod all_video
}
load_video
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod ext2
insmod png
insmod gfxterm
insmod gfxmenu
set gfxmode=auto
terminal_output gfxterm
set theme=($root)/boot/grub2/themes/fedokawaii/theme.txt
menuentry ' ' --class fkinstall {
	boot
}
menuentry ' ' --class fkcheck {
	linux /images/pxeboot/vmlinuz @ARGS@ fk.check
	initrd /images/pxeboot/initrd.img /images/pxeboot/fedokawaii-boot.img
	boot
}
