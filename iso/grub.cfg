# the boot menu of the fedokawaii installer (iso/grub.cfg; tools/build-iso.sh fills @…@). The menu's
# words are icons of the theme, PNG, its entries' titles empty: under Secure Boot Fedora's GRUB loads
# no font but its own Unifont, and PNG it does (iso-research.md §5).
set default="0"
set timeout=5
function load_video {
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod all_video
}
load_video
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod ext2
insmod png
insmod gfxterm
insmod gfxmenu
search --no-floppy --set=root -l '@VOLID@'
set gfxmode=auto
terminal_output gfxterm
set theme=($root)/boot/grub2/themes/fedokawaii/theme.txt
# (terminal_output console: GRUB's graphical terminal opens a black window of at least 80 × 24 letters,
# centred, while the kernel and the initrd load, and the signed image cannot change its black. Without
# it the menu stays as it is until the splash takes over)
menuentry ' ' --class fkinstall {
	terminal_output console
	linux /images/pxeboot/vmlinuz @ARGS@
	initrd /images/pxeboot/initrd.img /images/pxeboot/fedokawaii-boot.img
}
menuentry ' ' --class fkcheck {
	terminal_output console
	linux /images/pxeboot/vmlinuz @ARGS@ fk.check
	initrd /images/pxeboot/initrd.img /images/pxeboot/fedokawaii-boot.img
}
