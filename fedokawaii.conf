# fedokawaii.conf — the only file to edit. Every value is validated before anything runs.

USERNAME=""                       # empty = the user who ran sudo
GPU="auto"                        # auto | amd | intel
STEAM="yes"                       # yes | no — Steam, gamescope, MangoHud, GE-Proton, game mode
SSH_SERVER="no"                   # yes | no — a desktop doesn't need inbound SSH; "no" disables sshd
                                  #             and closes ssh/cockpit in the firewall

MONITOR_HZ="144"                  # target refresh rate (the highest mode ≤ this is used)
KB_LAYOUTS="us,ara"               # XKB layouts; the first is also used for keybindings
KB_TOGGLE="grp:alt_shift_toggle"  # layout switch: Alt+Shift
TIMEZONE="Asia/Dubai"
WEATHER_CITY="Sharjah"            # the weather's name for where you are (the bar, its week)
NIGHT_LIGHT="25.35:55.40"         # where you are, latitude:longitude: night light, weather

THEME="dark"                      # dark | light — the theme a new install starts in; switch any
                                  #   time in quick settings (the ⌄ key in the bar) → theme
WALLPAPER_PACK="yes"              # yes | no — fetch 120 wallpapers from GitHub (about 375 MB, once),
                                  #   60 for each theme, kept as they came
BOOT_MENU_SECONDS="0"             # 0–10 — how long the themed boot menu shows; 0 = hidden, as
                                  #   Fedora does (it appears only after a failed boot, or when you
                                  #   hold Shift or press F8 as the machine starts)

DNF_PARALLEL="10"                 # parallel downloads (1–20)

BACKUP_TARGET=""                  # where your files are backed up (kawa-backup, restic): a drive's
                                  #   name as the drives menu shows it, a folder's path, or a restic
                                  #   address (sftp:…, rest:…, s3:…, b2:…, rclone:…); empty = none yet.
                                  #   The password: RESTIC_PASSWORD in ~/.config/fedokawaii/secrets.sh
BACKUP_REMIND_DAYS="7"            # 0–365 — a notice when the last backup is older than this; 0 = off
                                  #   (these two count as soon as settings saves them: no update needed)

DWL_TAG="v0.9"                                         # dwl 0.9 builds against wlroots 0.20.x;
DWL_COMMIT="98bea2c27f99c549023fb394bfd983a439d8ccb9"  # the tag must resolve to exactly this commit
DWL_WLROOTS="0.20"                                     # Fedora 44 and 45 ship wlroots 0.20.2; dwl keeps
                                                       #   its own copy for later releases (setup.sh)
TFC_TAG="v1.4.3"                                       # the yazi file dialog (xdg-desktop-portal-termfilechooser,
TFC_COMMIT="cb8cec0b30aa6e2cc36b1b5cb34d6dc9a1face29"  # hunkyburrito's fork); the tag must resolve to this commit
